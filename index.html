<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CyberRush</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
  :root {
    --bg: #020b24; --rain: #3a8dff; --glow: #4fb0ff; --text: #eaf4ff; --label: #9ccbff; --panel: rgba(2, 10, 34, .9);
    --good: #2fd27a; --good-ink: #00230f; --bad: #ff6a5f;
    --font-mono: "Share Tech Mono", Consolas, "Courier New", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-mono);
    display: flex; min-height: 100vh; min-height: 100dvh;
    padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  main {
    position: relative; max-width: 640px; width: 100%; margin: auto; text-align: center;
    background: var(--panel); border: 1px solid var(--rain); border-radius: 4px;
    padding: 24px 18px; box-shadow: 0 0 24px rgba(58, 141, 255, .5), inset 0 0 18px rgba(58, 141, 255, .14);
    display: flex; flex-direction: column; gap: 14px;
  }
  .label { font-size: .85rem; letter-spacing: .28em; text-transform: uppercase; color: var(--label); }
  h1 {
    margin: 0; font-size: clamp(1.2rem, 4.8vw, 1.8rem); font-weight: 400; line-height: 1.3;
    text-wrap: balance; overflow-wrap: anywhere; text-shadow: 0 0 10px var(--glow), 0 0 2px var(--glow);
  }
  #choices { display: flex; flex-direction: column; gap: 10px; }
  .choice {
    font: inherit; font-size: 1rem; line-height: 1.35; color: var(--text); text-align: left; cursor: pointer;
    background: var(--bg); border: 1px solid var(--rain); border-radius: 4px; padding: 11px 12px;
    display: flex; gap: 10px; align-items: baseline; overflow-wrap: anywhere;
  }
  .choice b { color: var(--label); font-weight: 400; flex: none; }
  .choice span { min-width: 0; }
  .choice:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .choice:disabled { cursor: default; opacity: .6; }
  .choice.good { background: var(--good); border-color: var(--good); color: var(--good-ink); opacity: 1; }
  .choice.good b { color: var(--good-ink); }
  .choice.bad { border-color: var(--bad); color: var(--bad); opacity: 1; }
  .choice.bad b { color: var(--bad); }
  #verdict { margin: 0; min-height: 1.4em; letter-spacing: .12em; text-transform: uppercase; }
  #verdict.good { color: var(--good); }
  #verdict.bad { color: var(--bad); }
  #timer { display: flex; align-items: center; gap: 12px; }
  #timer .track { flex: 1; height: 8px; border: 1px solid var(--rain); border-radius: 4px; overflow: hidden; background: rgba(58, 141, 255, .12); }
  #timer .fill { height: 100%; width: 100%; background: var(--rain); box-shadow: 0 0 10px var(--glow); transform-origin: left center; }
  #time { min-width: 3ch; font-size: 1.6rem; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; text-shadow: 0 0 8px var(--glow); }
  #timer.low .fill { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
  #timer.low #time { color: var(--bad); text-shadow: 0 0 8px var(--bad); animation: pulse 1s steps(2, start) infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { #timer.low #time { animation: none; } }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<main>
  <div class="label" id="label">CyberRush</div>
  <div id="timer" hidden role="timer" aria-label="Temps restant"><div class="track"><div class="fill" id="fill"></div></div><span id="time">60</span></div>
  <h1 id="question">Scannez le QR code d'une carte pour afficher sa question.</h1>
  <div id="choices" hidden></div>
  <p id="verdict" hidden aria-live="polite"></p>
</main>
<script>
(() => {
  // Chaque carte : [question, [bonne réponse, mauvaise 1, mauvaise 2, mauvaise 3]]. L'ordre des choix est mélangé à l'affichage.
  const QUESTIONS = {"q001": ["Qu'est-ce que le phishing (hameçonnage) ?", ["Un message qui imite un organisme de confiance pour voler des identifiants", "Un logiciel qui intercepte le trafic d'un réseau Wi-Fi public", "Une technique qui redirige un nom de domaine vers un faux serveur", "Un programme qui enregistre en secret ce que l'utilisateur tape"]], "q002": ["Que signifie le sigle « 2FA » et à quoi sert-il ?", ["Authentification à deux facteurs : une seconde preuve d'un autre type que le mot de passe", "Authentification à deux fournisseurs : le compte est validé par deux services", "Double chiffrement : le mot de passe est chiffré deux fois avant envoi", "Authentification fédérée : un seul compte ouvre l'accès à deux applications"]], "q003": ["Quelles sont les caractéristiques d'un mot de passe robuste ?", ["Long, unique pour chaque compte et difficile à deviner", "Complexe, avec un symbole, et changé chaque semaine", "Composé de 8 caractères avec majuscules et chiffres", "Basé sur un mot courant avec quelques lettres remplacées par des chiffres"]], "q004": ["Qu'est-ce qu'un ransomware (rançongiciel) ?", ["Un logiciel qui chiffre les données et réclame un paiement pour les rendre", "Un logiciel qui vole les données puis les revend sur le dark web", "Un logiciel qui bloque l'accès au réseau jusqu'à une mise à jour", "Un logiciel qui exploite l'ordinateur pour miner de la cryptomonnaie"]], "q005": ["Quelle est la différence entre HTTP et HTTPS ?", ["HTTPS chiffre les échanges grâce à TLS, HTTP les transmet en clair", "HTTPS compresse les échanges, HTTP les envoie bruts", "HTTPS chiffre seulement les mots de passe, HTTP rien du tout", "HTTPS utilise le port 80, HTTP utilise le port 443"]], "q006": ["À quoi sert un pare-feu (firewall) ?", ["Autoriser ou bloquer le trafic réseau selon des règles", "Détecter et supprimer les logiciels malveillants installés", "Chiffrer toutes les communications sortantes de l'ordinateur", "Masquer l'adresse IP de l'utilisateur sur Internet"]], "q007": ["Que désigne la triade « CIA » (ou DIC en français) en sécurité informatique ?", ["Confidentialité, Intégrité, Disponibilité", "Confidentialité, Identification, Authentification", "Contrôle, Intégrité, Audit", "Chiffrement, Intégrité, Authenticité"]], "q008": ["Qu'est-ce qu'une attaque par force brute ?", ["Tester systématiquement toutes les combinaisons possibles d'un mot de passe", "Tester une liste de mots de passe volés sur plusieurs sites", "Retrouver un mot de passe à partir de son empreinte grâce à une table précalculée", "Deviner un mot de passe à partir d'informations publiques sur la victime"]], "q009": ["Qu'est-ce que l'ingénierie sociale ?", ["Manipuler une personne pour qu'elle révèle des informations ou agisse à son insu", "Analyser les réseaux sociaux pour cartographier une entreprise", "Exploiter une faille humaine dans le code d'une application", "Collecter des informations publiques avant une attaque (OSINT)"]], "q010": ["À quoi sert un VPN ?", ["Créer un tunnel chiffré entre l'appareil et un serveur distant", "Rendre l'utilisateur totalement anonyme sur Internet", "Bloquer les logiciels malveillants téléchargés", "Chiffrer les fichiers stockés sur l'ordinateur"]], "q011": ["Pourquoi faut-il installer rapidement les mises à jour de sécurité ?", ["Elles corrigent des failles connues que les attaquants peuvent exploiter", "Elles ajoutent un antivirus à jour dans le système", "Elles réinitialisent les mots de passe compromis", "Elles bloquent les failles zero-day encore inconnues"]], "q012": ["Qu'est-ce qu'une attaque DDoS ?", ["Rendre un service indisponible en le saturant depuis de nombreuses machines", "Prendre le contrôle d'un serveur depuis de nombreuses machines", "Saturer un serveur depuis une seule machine très puissante", "Intercepter le trafic d'un serveur pour le rediriger"]], "q013": ["Quelle est la différence entre chiffrement symétrique et asymétrique ?", ["Symétrique : une seule clé partagée ; asymétrique : une clé publique et une clé privée", "Symétrique : une clé publique et une privée ; asymétrique : une seule clé", "Symétrique : chiffre et signe ; asymétrique : chiffre seulement", "Symétrique : réversible ; asymétrique : irréversible comme un hachage"]], "q014": ["Qu'est-ce qu'une injection SQL ?", ["Insérer des commandes SQL dans une saisie pour manipuler la base de données", "Insérer un script dans une page pour qu'il s'exécute chez les visiteurs", "Envoyer des requêtes à la base de données pour la saturer", "Voler les identifiants de la base de données par hameçonnage"]], "q015": ["Qu'est-ce que la règle de sauvegarde « 3-2-1 » ?", ["3 copies, sur 2 supports différents, dont 1 hors site", "3 sauvegardes par jour, conservées 2 semaines, vérifiées 1 fois par mois", "3 supports différents, 2 copies chiffrées, 1 copie dans le cloud", "3 copies sur le même disque, 2 hors ligne, 1 en ligne"]], "q016": ["Qu'est-ce qu'une vulnérabilité « zero-day » ?", ["Une faille exploitée avant que l'éditeur ait publié un correctif", "Une faille découverte et corrigée le jour même", "Une faille sans aucun impact sur la sécurité", "Une faille qui ne touche que les systèmes jamais mis à jour"]], "q017": ["Quel est le rôle d'une fonction de hachage pour le stockage des mots de passe ?", ["Stocker une empreinte à sens unique au lieu du mot de passe", "Chiffrer le mot de passe pour pouvoir le déchiffrer à la connexion", "Compresser le mot de passe pour réduire la taille de la base", "Signer le mot de passe pour prouver qui l'a créé"]], "q018": ["Qu'est-ce qu'une attaque de l'homme du milieu (Man-in-the-Middle) ?", ["L'attaquant s'intercale entre deux parties pour lire ou modifier leurs échanges", "L'attaquant se fait passer pour un employé pour entrer dans un bâtiment", "L'attaquant prend le contrôle d'un routeur pour le rendre indisponible", "L'attaquant redirige une victime vers un faux site par e-mail"]], "q019": ["Que signifie le principe du « moindre privilège » ?", ["N'accorder que les droits strictement nécessaires à chaque tâche", "Donner les mêmes droits à tous pour éviter les erreurs", "Retirer tous les droits aux comptes inactifs depuis un an", "Réserver les droits d'administrateur à la direction"]], "q020": ["Quels indices permettent de repérer un e-mail frauduleux ?", ["Urgence inhabituelle, expéditeur douteux, lien vers une adresse différente", "Absence de logo, police inhabituelle, envoi le week-end", "Message court, pas de pièce jointe, signature complète", "Adresse en .fr, ton poli, lien en HTTPS"]], "q021": ["Qu'est-ce qu'un cheval de Troie ?", ["Un programme malveillant déguisé en logiciel légitime", "Un programme malveillant qui se copie seul de machine en machine", "Un programme malveillant qui chiffre les fichiers contre rançon", "Un programme malveillant qui affiche des publicités en boucle"]], "q022": ["Qu'est-ce qu'un ver informatique ?", ["Un programme malveillant qui se propage seul par le réseau", "Un programme malveillant qui doit être lancé par l'utilisateur", "Un programme malveillant caché dans un logiciel légitime", "Un programme malveillant qui se cache dans le noyau du système"]], "q023": ["Qu'est-ce qu'un keylogger ?", ["Un programme qui enregistre les frappes au clavier", "Un programme qui capture le trafic réseau", "Un programme qui vole les clés de chiffrement", "Un programme qui journalise les connexions au système"]], "q024": ["Qu'est-ce qu'un spyware (logiciel espion) ?", ["Un logiciel qui collecte des informations sur l'utilisateur à son insu", "Un logiciel qui affiche des publicités ciblées", "Un logiciel qui donne un accès à distance à l'attaquant", "Un logiciel qui surveille le réseau pour l'administrateur"]], "q025": ["Qu'est-ce qu'un adware ?", ["Un logiciel qui affiche des publicités non désirées", "Un logiciel qui collecte les mots de passe enregistrés", "Un logiciel qui modifie la page d'accueil pour rediriger vers un faux site", "Un logiciel qui utilise la machine pour miner de la cryptomonnaie"]], "q026": ["Qu'est-ce qu'un rootkit ?", ["Un outil qui dissimule la présence d'un attaquant sur un système", "Un outil qui donne les droits administrateur à un utilisateur légitime", "Un outil qui chiffre le disque au démarrage", "Un outil qui analyse le système à la recherche de virus"]], "q027": ["Qu'est-ce qu'un botnet ?", ["Un réseau de machines infectées pilotées à distance", "Un réseau de serveurs qui filtre les attaques", "Un réseau de robots qui teste la sécurité d'un site", "Un réseau privé utilisé par les attaquants pour se cacher"]], "q028": ["Qu'est-ce qu'une porte dérobée (backdoor) ?", ["Un accès caché qui contourne l'authentification normale", "Un compte de secours prévu par l'administrateur", "Une faille du pare-feu laissant passer tout le trafic", "Un port réseau laissé ouvert par erreur"]], "q029": ["Qu'est-ce qu'un malware « sans fichier » (fileless) ?", ["Un malware qui s'exécute en mémoire à l'aide d'outils légitimes du système", "Un malware qui efface ses fichiers après s'être installé", "Un malware qui se cache dans un fichier image", "Un malware qui ne fonctionne que dans le navigateur"]], "q030": ["Comment un ransomware entre-t-il le plus souvent dans une entreprise ?", ["Par un e-mail piégé ou un accès à distance mal protégé", "Par une mise à jour officielle de Windows", "Par une clé USB fournie par le service informatique", "Par un site web consulté en HTTPS"]], "q031": ["Qu'est-ce que le spear phishing ?", ["Un hameçonnage ciblé et personnalisé pour une personne précise", "Un hameçonnage qui vise les dirigeants par téléphone", "Un hameçonnage envoyé en masse avec un lien unique", "Un hameçonnage qui passe par les réseaux sociaux"]], "q032": ["Qu'est-ce que le smishing ?", ["Un hameçonnage par SMS", "Un hameçonnage par appel vocal", "Un hameçonnage par QR code", "Un hameçonnage par messagerie instantanée professionnelle"]], "q033": ["Qu'est-ce que le vishing ?", ["Un hameçonnage par appel téléphonique", "Un hameçonnage par visioconférence piégée", "Un hameçonnage par SMS", "Un hameçonnage par fausse publicité vidéo"]], "q034": ["Qu'est-ce que la fraude au président (faux dirigeant) ?", ["Un escroc se fait passer pour un dirigeant afin d'obtenir un virement urgent", "Un employé détourne de l'argent en imitant la signature d'un dirigeant", "Un pirate prend le contrôle de la messagerie du dirigeant pour la lire", "Un escroc se fait passer pour un fournisseur pour changer un RIB"]], "q035": ["Qu'est-ce que le typosquatting ?", ["Enregistrer un nom de domaine proche d'un site connu pour piéger les fautes de frappe", "Rediriger un nom de domaine existant vers un faux serveur", "Racheter un nom de domaine expiré pour récupérer son trafic", "Copier le contenu d'un site sur un autre nom de domaine"]], "q036": ["Qu'est-ce qu'une attaque par dictionnaire ?", ["Essayer les mots de passe d'une liste de mots et de mots de passe courants", "Essayer toutes les combinaisons de caractères possibles", "Retrouver un mot de passe à partir de son empreinte précalculée", "Réutiliser des identifiants volés sur un autre site"]], "q037": ["Qu'est-ce que le credential stuffing ?", ["Tester sur d'autres sites des identifiants volés lors d'une fuite", "Tester toutes les combinaisons possibles d'un mot de passe", "Saisir automatiquement ses identifiants avec un gestionnaire", "Voler des identifiants avec un faux formulaire de connexion"]], "q038": ["Qu'est-ce que le shoulder surfing ?", ["Observer discrètement l'écran ou le clavier de quelqu'un pour voler ses codes", "Suivre un employé pour entrer dans un bâtiment sécurisé", "Fouiller les poubelles d'une entreprise pour trouver des informations", "Écouter les conversations dans un lieu public"]], "q039": ["Qu'est-ce qu'une clé USB piégée laissée à l'abandon ?", ["Un appât pour pousser quelqu'un à la brancher et infecter sa machine", "Une clé perdue qui contient des données sensibles", "Une clé chiffrée oubliée par un collègue", "Une clé utilisée pour sauvegarder des fichiers hors ligne"]], "q040": ["Qu'est-ce que le tailgating en sécurité physique ?", ["Entrer dans une zone protégée en suivant de près une personne autorisée", "Observer quelqu'un taper son code d'accès", "Fabriquer un faux badge d'accès", "Se faire passer pour un technicien au téléphone"]], "q041": ["Qu'est-ce qu'une menace interne ?", ["Un risque venant d'une personne qui a un accès légitime à l'organisation", "Un risque venant d'un logiciel installé sur le réseau interne", "Un risque venant d'une faille dans un serveur interne", "Un risque venant d'un pirate déjà infiltré sur le réseau"]], "q042": ["Qu'est-ce qu'une APT (Advanced Persistent Threat) ?", ["Une attaque ciblée et discrète qui reste longtemps dans un réseau", "Une attaque automatisée qui vise des milliers de cibles au hasard", "Une faille ancienne jamais corrigée dans un logiciel", "Une attaque par déni de service qui dure plusieurs jours"]], "q043": ["Qu'est-ce qu'une attaque XSS (Cross-Site Scripting) ?", ["Injecter un script dans une page pour qu'il s'exécute chez les autres visiteurs", "Injecter des commandes SQL dans un formulaire", "Forcer un utilisateur connecté à envoyer une requête à son insu", "Charger un site dans un cadre invisible pour piéger les clics"]], "q044": ["Qu'est-ce qu'une attaque CSRF ?", ["Faire envoyer une requête par un utilisateur connecté, à son insu", "Injecter un script dans une page vue par d'autres visiteurs", "Voler un cookie de session par le réseau", "Contourner le CORS pour lire les données d'un autre site"]], "q045": ["À quoi sert un cookie sur un site web ?", ["Garder de petites données dans le navigateur, comme l'identifiant de session", "Stocker le mot de passe de l'utilisateur en clair", "Chiffrer la connexion entre le navigateur et le site", "Enregistrer l'historique de navigation sur le serveur"]], "q046": ["Pourquoi le vol d'un cookie de session est-il dangereux ?", ["Il permet de reprendre la session de la victime sans connaître son mot de passe", "Il permet de lire le mot de passe stocké dans le cookie", "Il permet de déchiffrer tout le trafic HTTPS de la victime", "Il permet d'installer un malware dans le navigateur"]], "q047": ["Que garantit le cadenas dans la barre d'adresse ?", ["Que la connexion avec le site est chiffrée", "Que le site appartient à une entreprise vérifiée", "Que le site ne contient aucun logiciel malveillant", "Que le site respecte le RGPD"]], "q048": ["Qu'est-ce qu'un certificat TLS ?", ["Un fichier signé qui lie une clé publique à un nom de domaine", "Un fichier qui contient la clé privée du site", "Un label qui prouve que le site est sans danger", "Un mot de passe partagé entre le navigateur et le serveur"]], "q049": ["Qu'est-ce qu'un WAF ?", ["Un pare-feu applicatif qui filtre les requêtes HTTP malveillantes", "Un pare-feu réseau qui filtre les ports ouverts", "Un outil qui chiffre le trafic entre deux sites", "Un antivirus installé sur le serveur web"]], "q050": ["Qu'est-ce que l'OWASP Top 10 ?", ["Le classement des risques les plus critiques des applications web", "Le classement des failles les plus coûteuses de l'année", "La norme officielle de certification des sites web", "La liste des 10 attaques les plus fréquentes contre les réseaux"]], "q051": ["Pourquoi vérifier côté serveur les données saisies par les utilisateurs ?", ["Parce qu'un attaquant peut contourner les vérifications faites dans le navigateur", "Parce que le navigateur ne sait pas vérifier les formulaires", "Parce que la vérification côté serveur chiffre les données", "Parce que les données sont plus rapides à traiter sur le serveur"]], "q052": ["Qu'est-ce qu'une adresse IP ?", ["Un identifiant numérique d'un appareil sur un réseau", "L'identifiant physique gravé dans la carte réseau", "Le nom de domaine d'un site web", "Le numéro qui identifie un service sur une machine"]], "q053": ["À quoi sert le DNS ?", ["Traduire un nom de domaine en adresse IP", "Attribuer automatiquement une adresse IP aux appareils", "Traduire une adresse IP en adresse MAC", "Chiffrer les échanges entre deux serveurs"]], "q054": ["Qu'est-ce que le DNS spoofing ?", ["Falsifier des réponses DNS pour rediriger vers un serveur malveillant", "Saturer un serveur DNS pour le rendre indisponible", "Enregistrer un nom de domaine proche d'un site connu", "Intercepter le trafic Wi-Fi pour lire les requêtes"]], "q055": ["Pourquoi un Wi-Fi public est-il risqué ?", ["Le trafic peut être intercepté et le point d'accès peut être un faux", "Il désactive automatiquement le chiffrement HTTPS", "Il donne à tous les utilisateurs accès aux fichiers de l'appareil", "Il installe un certificat sur l'appareil à la connexion"]], "q056": ["Qu'est-ce qu'un « evil twin » en Wi-Fi ?", ["Un faux point d'accès qui imite le nom d'un réseau légitime", "Un second routeur qui double la portée du Wi-Fi", "Un point d'accès légitime piraté à distance", "Un réseau Wi-Fi caché qui ne diffuse pas son nom"]], "q057": ["Quelle sécurité Wi-Fi est recommandée aujourd'hui ?", ["WPA3, ou WPA2 à défaut", "WPA2 avec TKIP", "WEP 128 bits", "WPA avec WPS activé"]], "q058": ["Qu'est-ce qu'un port réseau ?", ["Un numéro qui identifie un service sur une machine", "L'adresse physique d'une carte réseau", "Le numéro d'une prise sur un switch", "L'identifiant d'un réseau local"]], "q059": ["Qu'est-ce qu'un scan de ports ?", ["Sonder une machine pour découvrir quels services sont ouverts", "Bloquer tous les ports non utilisés d'une machine", "Analyser le contenu des paquets qui passent sur un port", "Rediriger un port vers une autre machine"]], "q060": ["Qu'est-ce qu'une DMZ en réseau ?", ["Une zone isolée qui accueille les serveurs exposés à Internet", "La partie du réseau réservée aux administrateurs", "Un réseau Wi-Fi séparé pour les invités", "Une zone sans pare-feu pour accélérer le trafic"]], "q061": ["Qu'est-ce qu'un IDS ?", ["Un système qui détecte les intrusions et lève des alertes", "Un système qui bloque automatiquement le trafic suspect", "Un système qui vérifie l'identité d èmes d'information", "L'autorité qui contrôle le respect du RGPD", "Le service de police spécialisé dans la cybercriminalité", "L'agence qui gère les noms de domaine en .fr"]], "q106": ["Quel site officiel aide les victimes de cybermalveillance en France ?", ["cybermalveillance.gouv.fr", "cnil.fr", "ssi.gouv.fr", "legifrance.gouv.fr"]]};
  const $ = (id) => document.getElementById(id);

  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const DURATION = 60;
  let timerId = null;

  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  function startTimer(onEnd) {
    stopTimer();
    const end = Date.now() + DURATION * 1000;
    const box = $("timer"), fill = $("fill"), time = $("time");
    box.hidden = false;
    const tick = () => {
      const leftMs = Math.max(0, end - Date.now());
      const left = Math.ceil(leftMs / 1000);
      time.textContent = String(left);
      fill.style.transform = "scaleX(" + (leftMs / (DURATION * 1000)) + ")";
      box.classList.toggle("low", left <= 10);
      if (leftMs <= 0) { stopTimer(); onEnd(); }
    };
    tick();
    timerId = setInterval(tick, 200);
  }

  function showChoices(choices) {
    const good = choices[0];
    const box = $("choices"), verdict = $("verdict");
    const reveal = (picked) => {
      stopTimer();
      buttons.forEach((x) => { x.disabled = true; if (x.lastChild.textContent === good) x.classList.add("good"); });
      if (picked && picked.lastChild.textContent !== good) picked.classList.add("bad");
      const ok = picked && picked.lastChild.textContent === good;
      verdict.textContent = !picked ? "Temps écoulé" : ok ? "Bonne réponse" : "Mauvaise réponse";
      verdict.className = ok ? "good" : "bad";
      verdict.hidden = false;
    };
    const buttons = shuffled(choices).map((text, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "choice";
      const letter = document.createElement("b");
      letter.textContent = "ABCD"[i] + ".";
      const label = document.createElement("span");
      label.textContent = text;
      b.append(letter, label);
      b.addEventListener("click", () => reveal(b));
      return b;
    });
    box.replaceChildren(...buttons);
    box.hidden = false;
    verdict.hidden = true;
    startTimer(() => reveal(null));
  }

  function cardId() {
    const fromQuery = new URLSearchParams(location.search).get("c");
    const raw = (fromQuery || location.hash.replace(/^#/, "")).trim().toLowerCase();
    const m = raw.match(/^q?(\d{1,3})$/);
    return m ? "q" + m[1].padStart(3, "0") : raw;
  }

  function show() {
    const id = cardId();
    stopTimer();
    $("timer").hidden = true;
    $("choices").hidden = true;
    $("verdict").hidden = true;
    if (!id) {
      $("label").textContent = "CyberRush";
      $("question").textContent = "Scannez le QR code d'une carte pour afficher sa question.";
    } else if (Object.prototype.hasOwnProperty.call(QUESTIONS, id)) {
      $("label").textContent = "Question " + Number(id.slice(1));
      $("question").textContent = QUESTIONS[id][0];
      showChoices(QUESTIONS[id][1]);
    } else {
      $("label").textContent = "Carte inconnue";
      $("question").textContent = "Cette carte n'existe pas dans le jeu.";
    }
  }

  // Fond animé : des colonnes de 0 et 1 qui descendent, scintillent, et des traînées de lumière qui pulsent.
  const canvas = $("rain");
  const ctx = canvas.getContext("2d");
  const still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, size = 16, colW = 15, rowH = 20, rows = 0, cols = [], streaks = [], bgLayer = null;

  function cell(boost) {
    const bright = Math.random();
    return { ch: Math.random() < 0.5 ? "0" : "1", hi: bright > 0.94, a: Math.random() < 0.18 ? 0 : Math.min(1, 0.15 + bright * 0.55 + boost) };
  }

  function setup() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    size = Math.max(13, Math.min(20, W / 34));
    colW = size * 0.95;
    rowH = size * 1.25;
    rows = Math.ceil(H / rowH) + 2;
    const n = Math.ceil(W / colW) + 1;
    cols = [];
    streaks = [];
    for (let c = 0; c < n; c++) {
      const boost = Math.random() < 0.15 ? 0.35 : 0;
      const cells = [];
      for (let r = 0; r < rows; r++) cells.push(cell(boost));
      cols.push({ x: c * colW + colW / 2, speed: 0.6 + Math.random() * 2.2, off: Math.random() * rowH, boost, cells });
      if (Math.random() < 0.12) streaks.push({ x: c * colW + colW / 2, peak: 0.2 + Math.random() * 0.5, a: 0.12 + Math.random() * 0.22, phase: Math.random() * Math.PI * 2, rate: 0.4 + Math.random() * 0.8 });
    }
    bgLayer = document.createElement("canvas");
    bgLayer.width = canvas.width; bgLayer.height = canvas.height;
    const b = bgLayer.getContext("2d");
    b.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = b.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, "#0a2a6b");
    g.addColorStop(1, "#010718");
    b.fillStyle = g;
    b.fillRect(0, 0, W, H);
  }

  function render(t) {
    ctx.drawImage(bgLayer, 0, 0, W, H);
    for (const s of streaks) {
      const a = s.a * (0.55 + 0.45 * Math.sin(t * s.rate + s.phase));
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, "rgba(40, 120, 255, 0)");
      grad.addColorStop(s.peak, "rgba(60, 150, 255, " + a.toFixed(3) + ")");
      grad.addColorStop(1, "rgba(40, 120, 255, 0)");
      ctx.fillStyle = grad;
      ctx.fillRect(s.x - colW * 0.7, 0, colW * 1.4, H);
    }
    ctx.font = size + 'px "Share Tech Mono", Consolas, "Courier New", monospace';
    ctx.textBaseline = "top";
    ctx.textAlign = "center";
    for (const col of cols) {
      for (let r = 0; r < col.cells.length; r++) {
        const c = col.cells[r];
        if (!c.a) continue;
        const y = (r - 1) * rowH + col.off;
        if (c.hi) {
          ctx.fillStyle = "rgba(108, 192, 255, " + (c.a * 0.35).toFixed(3) + ")";
          ctx.fillText(c.ch, col.x, y - 1);
          ctx.fillStyle = "rgba(225, 240, 255, " + c.a.toFixed(3) + ")";
        } else {
          ctx.fillStyle = "rgba(70, 150, 255, " + c.a.toFixed(3) + ")";
        }
        ctx.fillText(c.ch, col.x, y);
      }
    }
  }

  let last = 0;
  function step(now) {
    requestAnimationFrame(step);
    if (now - last < 33) return;
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    for (const col of cols) {
      col.off += col.speed * rowH * dt;
      while (col.off >= rowH) { col.off -= rowH; col.cells.pop(); col.cells.unshift(cell(col.boost)); }
      if (Math.random() < 0.08) { const c = col.cells[Math.floor(Math.random() * col.cells.length)]; c.ch = c.ch === "0" ? "1" : "0"; }
    }
    render(now / 1000);
  }

  show();
  setup();
  render(0);
  if (!still) requestAnimationFrame(step);
  window.addEventListener("hashchange", show);
  let lastW = window.innerWidth;
  window.addEventListener("resize", () => {
    if (Math.abs(window.innerWidth - lastW) < 2 && Math.abs(window.innerHeight - H) < 120) return;
    lastW = window.innerWidth; setup(); render(0);
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(0));
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
